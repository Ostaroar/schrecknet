[package]
name = "schrecknet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SchreckNet domain core: deck logic for VTES V5, compiled to WASM and native"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fastembed = { version = "5.17.3", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
regex = "1.13.1"
serde_json = { workspace = true }
sha2 = "0.10"
