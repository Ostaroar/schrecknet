# Single replica: schrecknet-data volume is ReadWriteOnce (DO block storage).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schrecknet-server
  namespace: schrecknet
spec:
  replicas: 1
  strategy:
    type: Recreate # avoid two pods mounting the same RWO volume during rollout
  selector:
    matchLabels:
      app: schrecknet-server
  template:
    metadata:
      labels:
        app: schrecknet-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/ostaroar/schrecknet:main
          # :main is a mutable tag; without this, kubelet's default
          # IfNotPresent policy would keep reusing whatever digest is already
          # cached on the node even after a newer image is pushed.
          imagePullPolicy: Always
          env:
            # Passkey relying party (docs/adr/0019). WebAuthn checks these
            # against the origin the browser is actually on, so they belong
            # with the deployment rather than baked into the image — and the
            # code's localhost defaults are for local dev only. RP ID must be
            # the registrable domain serving the app; only the apex resolves
            # (there is no www record), so no subdomain scope is needed.
            - name: SCHRECKNET_RP_ID
              value: schreck-net.com
            - name: SCHRECKNET_RP_ORIGIN
              value: https://schreck-net.com
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: schrecknet-data
---
apiVersion: v1
kind: Service
metadata:
  name: schrecknet-server
  namespace: schrecknet
spec:
  selector:
    app: schrecknet-server
  ports:
    - port: 80
      targetPort: 8000
