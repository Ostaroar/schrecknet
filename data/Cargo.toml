[package]
name = "schrecknet-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SchreckNet card-data pipeline: KRCG/VEKN sources -> V5-filtered cards.sqlite"

[dependencies]
fastembed = { version = "5.17.3", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schrecknet-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
ureq = "2"
