[package]
name = "schrecknet-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SchreckNet server: static hosting + REST + MCP (single binary)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# tower is already pulled in transitively by axum/tower-http; promoted to a
# direct dependency for ServiceBuilder (per-route compression/cache-header
# composition), not a new addition to the dependency tree.
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-full", "set-header", "trace"] }
# tracing is already pulled in transitively (rmcp/tokio); tracing-subscriber
# is the one new dependency here (docs/adr/0011-tracing-for-http-access-logs.md).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true }
schrecknet-core = { path = "../core" }
rmcp = { version = "2.2.0", features = ["server", "transport-streamable-http-server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
schemars = "1.2.1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
regex = "1.13.1"
argon2 = "0.5.3"
# docs/adr/0017-utoipa-for-openapi.md
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8.1", features = ["axum"] }

[dev-dependencies]
serde_urlencoded = "0.7.1"
