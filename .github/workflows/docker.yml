name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'core/**'
      - 'server/**'
      - 'frontend/**'
      - 'data/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'server/**'
      - 'frontend/**'
      - 'data/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is amd64-only for now, matching the hosted runner, so QEMU
      # adds setup time without doing any work. Restore it with arm64 support.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 later: QEMU-emulated Rust builds are too slow; needs cross or a native runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Real deployment origin (docs/seo-geo-aeo-plan.md § 5) -- without
          # this the prerender-build stage deliberately skips sitemap.xml
          # rather than publish one with a placeholder domain.
          build-args: |
            SITE_URL=https://schreck-net.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Only main pushes -- never PRs (no cluster credentials there, and
    # nothing should touch prod from an untrusted fork) and never tags
    # (a `v*` tag build isn't necessarily what's rolled out to the live
    # single-replica deployment, which always tracks `:main`; see
    # docs/adr/0013-ci-deploys-on-push-to-main.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save k8s-1-36-0-do-3-fra1-1784797648512

      # imagePullPolicy: Always + a rollout restart is enough here -- the
      # deployment always tracks the `:main` tag (k8s/deployment.yaml), so
      # there's no image reference to bump, just a pod to recreate.
      - name: Roll out schreck-net.com
        run: |
          kubectl -n schrecknet rollout restart deployment/schrecknet-server
          kubectl -n schrecknet rollout status deployment/schrecknet-server --timeout=120s
