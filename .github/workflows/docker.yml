name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'core/**'
      - 'server/**'
      - 'frontend/**'
      - 'data/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'server/**'
      - 'frontend/**'
      - 'data/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two of these against the deployment at once. `k8s/deployment.yaml`
# is a single replica with `strategy: Recreate`, so two overlapping
# `rollout restart`s race each other over one pod. Deliberately NOT
# cancel-in-progress: a half-finished deploy is worse than a queued one, so let
# the in-flight run land and queue the next behind it.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is amd64-only for now, matching the hosted runner, so QEMU
      # adds setup time without doing any work. Restore it with arm64 support.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 later: QEMU-emulated Rust builds are too slow; needs cross or a native runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Real deployment origin (docs/seo-geo-aeo-plan.md § 5) -- without
          # this the prerender-build stage deliberately skips sitemap.xml
          # rather than publish one with a placeholder domain.
          build-args: |
            SITE_URL=https://schreck-net.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-ghcr:
    needs: build
    # Same push-to-main-only gate as `deploy` -- no reason to prune on PR
    # builds (which don't push anyway) or tag builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Every push creates ~3 GHCR package versions (one tagged image plus
      # two untagged buildx provenance/SBOM attestations), and GitHub's free
      # shared-storage quota covers Actions artifacts AND package storage
      # together. Left unpruned this silently exhausts that quota -- it hit
      # 381 versions / ~0 free MB within a few days of active work, which
      # then broke the (unrelated) `rust`/`frontend` artifact uploads in
      # ci.yml with "Artifact storage quota has been hit".
      #
      # Keeps the newest 15 versions (~5 builds' worth: current `:main` plus
      # a rollback buffer) and deletes everything older, mirroring the
      # one-off manual cleanup this replaces.
      #
      # GITHUB_TOKEN cannot delete package versions for a user-namespace
      # package (only org-linked ones) -- this needs a classic PAT with the
      # delete:packages scope, stored as GHCR_CLEANUP_TOKEN (added + verified
      # against a real push-to-main run on 2026-07-25).
      - uses: actions/delete-package-versions@v5
        with:
          package-name: schrecknet
          package-type: container
          min-versions-to-keep: 15
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}

  # Runs the ACTUAL production image before it is allowed to reach the cluster.
  # ci.yml's e2e job is a bare runner: debug binary, `npm run build` output, and
  # no prerender stage — so the distroless runtime, the release build, the baked
  # SITE_URL and the 829 prerendered card pages all shipped to production with
  # nothing but "the image built" behind them. This job closes that gap and
  # gates `deploy`, which is the closest thing to pre-production validation
  # available without a staging cluster.
  #
  # It pulls rather than reusing a `load`ed image because jobs get separate
  # Docker daemons; exporting a tarball between them would burn the shared
  # artifact-storage quota this project has already exhausted once.
  container-e2e:
    needs: build
    # Same push-to-main gate as `deploy`: PR builds are never pushed, so there
    # is nothing to pull. PRs are still covered by ci.yml's full e2e job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the production image
        run: |
          set -euo pipefail
          # Must match docker/metadata-action's `type=sha`, which is the first
          # 7 characters. Derived from GITHUB_SHA rather than `git rev-parse
          # --short`, whose length can grow to disambiguate and would then miss.
          #
          # Lowercased because `github.repository` preserves the owner's casing
          # ("Ostaroar/schrecknet") and Docker rejects uppercase in a reference.
          # metadata-action does this for us on the push side, which is why the
          # pushed tag is lowercase while a naive reference here is not.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}:sha-${GITHUB_SHA:0:7}"
          echo "testing $image"
          docker pull "$image"
          # /data is a VOLUME in the image (app.sqlite lives there); an
          # anonymous volume keeps this run isolated from anything else.
          docker run -d --name schrecknet-candidate -p 18190:8000 "$image"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18190/healthz >/dev/null 2>&1; then
              echo "container healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs schrecknet-candidate || true
          exit 1

      # Only the image can answer these: they are produced by the Dockerfile's
      # prerender-build stage, which no other test exercises.
      - name: Prerendered pages and sitemap are really in the image
        run: |
          set -euo pipefail
          base=http://127.0.0.1:18190

          # Written to files rather than piped from a shell variable: `grep -q`
          # exits at the first match and closes the pipe, which SIGPIPEs the
          # producing `echo` and, under `set -o pipefail`, fails the step no
          # matter what the content was.
          curl -fsS "$base/cards/100401" -o /tmp/card.html
          grep -q 'application/ld+json' /tmp/card.html \
            || { echo "::error::/cards/100401 is not prerendered (SPA fallback?)"; exit 1; }
          grep -q '<title>Conditioning' /tmp/card.html \
            || { echo "::error::/cards/100401 prerendered with the wrong title"; exit 1; }

          # SITE_URL is baked at build time; without it the data build
          # deliberately emits no sitemap rather than one with a placeholder
          # domain, so a missing origin means the build arg went astray.
          curl -fsS "$base/sitemap.xml" -o /tmp/sitemap.xml
          grep -q 'https://schreck-net.com/' /tmp/sitemap.xml \
            || { echo "::error::sitemap.xml missing the real origin (SITE_URL build arg lost?)"; exit 1; }
          # Floor, not an exact count: the V5 pool moves as Black Chantry
          # publishes and as pool corrections land (it was 829 cards when the
          # prerenderer shipped, 749 today). This catches prerendering
          # collapsing, without breaking every time the pool changes size.
          urls=$(grep -c '<loc>' /tmp/sitemap.xml || true)
          [ "$urls" -gt 700 ] || { echo "::error::sitemap has only $urls URLs, expected >700"; exit 1; }
          echo "prerender OK: $urls sitemap URLs"

      # index.html names every hashed asset, so if it may be cached
      # heuristically a returning visitor gets pinned to a previous deploy's
      # whole module graph — observed live. Only content-addressed URLs may be
      # immutable. This asserts the layer ordering on the wire, which is where
      # the bug was (the helper's unit tests all passed while HTML shipped with
      # no Cache-Control at all).
      - name: HTML revalidates, hashed assets stay immutable
        run: |
          set -euo pipefail
          base=http://127.0.0.1:18190
          asset=$(curl -fsS "$base/crypt" | grep -o 'main-[A-Za-z0-9_-]*\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::could not find the main bundle in /crypt"; exit 1; }

          for url in / /crypt /cards/100401 /data/cards.meta.json; do
            cc=$(curl -fsSI "$base$url" | tr -d '\r' | grep -i '^cache-control:' || true)
            case "$cc" in
              *no-cache*) ;;
              *) echo "::error::$url must revalidate, got '${cc:-<absent>}'"; exit 1 ;;
            esac
          done

          cc=$(curl -fsSI "$base/assets/$asset" | tr -d '\r' | grep -i '^cache-control:' || true)
          case "$cc" in
            *immutable*) ;;
            *) echo "::error::/assets/$asset should be immutable, got '${cc:-<absent>}'"; exit 1 ;;
          esac
          echo "cache-control matrix OK"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend

      # The browser suites, driven against the container instead of a debug
      # binary they spawn themselves (SCHRECKNET_E2E_BASE_URL). sw-upgrade is
      # deliberately absent: it swaps the server's static dir between two
      # builds, which a single baked image cannot do — it stays in ci.yml.
      - name: Browser suites against the production image
        env:
          SCHRECKNET_E2E_BASE_URL: http://127.0.0.1:18190
          SCHRECKNET_CHROME_CHANNEL: chrome
        run: |
          npm run test:mobile
          npm run test:backup
          npm run test:semantic
        working-directory: frontend

      - name: Container logs on failure
        if: failure()
        run: docker logs schrecknet-candidate || true

  deploy:
    needs: container-e2e
    # Only main pushes -- never PRs (no cluster credentials there, and
    # nothing should touch prod from an untrusted fork) and never tags
    # (a `v*` tag build isn't necessarily what's rolled out to the live
    # single-replica deployment, which always tracks `:main`; see
    # docs/adr/0013-ci-deploys-on-push-to-main.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save k8s-1-36-0-do-3-fra1-1784797648512

      # `apply` first, so a manifest change (env vars, probes, resources) takes
      # effect on the deploy that introduced it. Before this, manifests were
      # applied by hand only at bootstrap, so an edited deployment.yaml sat
      # inert in git until someone remembered -- which is exactly how the
      # passkey relying-party config (docs/adr/0019) would have shipped
      # silently misconfigured.
      #
      # It also repairs the `rollout undo` trap documented in k8s/README.md:
      # a rollback pins an immutable `sha-` tag into the pod template, which
      # used to make every later `rollout restart` a silent no-op until someone
      # un-pinned it by hand. `apply` restores the `:main` tag, so the next
      # push to main genuinely deploys again. Rolling back therefore holds
      # until the next push to main -- land the fix, don't just roll back.
      #
      # `rollout restart` is still needed after it: when only the image
      # *contents* changed, the manifest is byte-identical and `apply` is a
      # no-op, so nothing would recreate the pod.
      - name: Roll out schreck-net.com
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl -n schrecknet rollout restart deployment/schrecknet-server
          kubectl -n schrecknet rollout status deployment/schrecknet-server --timeout=120s

      # `rollout status` only proves the pod passed its readiness probe, and
      # that probe is `httpGet /` (k8s/deployment.yaml) -- which happily returns
      # index.html while the app is completely dead. During the 2026-07-29
      # outage both SQLite workers hung and this job still reported green.
      # These checks assert the things that were actually broken then:
      # the served HTML, the card database, and a prerendered card page.
      - name: Smoke-check the live site
        run: |
          set -euo pipefail
          base=https://schreck-net.com

          # 1. The shell is served and is really our app.
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$base/crypt" \
            | grep -q 'id="root"' || { echo "::error::/crypt did not return the app shell"; exit 1; }

          # 2. The card database the workers load is present and non-trivial.
          #    A hung worker can't be seen from curl, but a missing/broken
          #    /data payload is the other half of that failure mode.
          meta=$(curl -fsS "$base/data/cards.meta.json")
          echo "$meta" | grep -q '"schema_version"' || { echo "::error::cards.meta.json malformed"; exit 1; }
          bytes=$(curl -fsS -o /dev/null -w '%{size_download}' "$base/data/cards.sqlite")
          [ "$bytes" -gt 1000000 ] || { echo "::error::cards.sqlite too small ($bytes bytes)"; exit 1; }

          # 3. A card page is really prerendered, not just the SPA shell.
          #    (Dockerfile's prerender-build stage; 829 of these ship per build
          #    and nothing else tests them.) The JSON-LD block is the marker:
          #    a prerendered page has one, the SPA fallback has none -- so
          #    grepping for <title> alone would pass even when prerendering is
          #    completely broken. Card 100401 is Conditioning, a base-set V5
          #    card; if it ever leaves the pool this failing is correct.
          card=$(curl -fsS "$base/cards/100401")
          echo "$card" | grep -q 'application/ld+json' \
            || { echo "::error::/cards/100401 is not prerendered (no JSON-LD -- SPA fallback?)"; exit 1; }
          echo "$card" | grep -q '<title>Conditioning' \
            || { echo "::error::/cards/100401 prerendered with the wrong title"; exit 1; }

          # 4. The shell must revalidate. Without this it carried no
          #    Cache-Control at all, so returning visitors could keep booting a
          #    previous deploy's asset graph indefinitely.
          cc=$(curl -fsSI "$base/crypt" | tr -d '\r' | grep -i '^cache-control:' || true)
          case "$cc" in
            *no-cache*) ;;
            *) echo "::error::/crypt must revalidate, got '${cc:-<absent>}'"; exit 1 ;;
          esac

          echo "live smoke check passed ($bytes bytes of card data)"
