name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'core/**'
      - 'server/**'
      - 'frontend/**'
      - 'data/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'server/**'
      - 'frontend/**'
      - 'data/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two of these against the deployment at once. `k8s/deployment.yaml`
# is a single replica with `strategy: Recreate`, so two overlapping
# `rollout restart`s race each other over one pod. Deliberately NOT
# cancel-in-progress: a half-finished deploy is worse than a queued one, so let
# the in-flight run land and queue the next behind it.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is amd64-only for now, matching the hosted runner, so QEMU
      # adds setup time without doing any work. Restore it with arm64 support.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 later: QEMU-emulated Rust builds are too slow; needs cross or a native runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Real deployment origin (docs/seo-geo-aeo-plan.md § 5) -- without
          # this the prerender-build stage deliberately skips sitemap.xml
          # rather than publish one with a placeholder domain.
          build-args: |
            SITE_URL=https://schreck-net.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-ghcr:
    needs: build
    # Same push-to-main-only gate as `deploy` -- no reason to prune on PR
    # builds (which don't push anyway) or tag builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Every push creates ~3 GHCR package versions (one tagged image plus
      # two untagged buildx provenance/SBOM attestations), and GitHub's free
      # shared-storage quota covers Actions artifacts AND package storage
      # together. Left unpruned this silently exhausts that quota -- it hit
      # 381 versions / ~0 free MB within a few days of active work, which
      # then broke the (unrelated) `rust`/`frontend` artifact uploads in
      # ci.yml with "Artifact storage quota has been hit".
      #
      # Keeps the newest 15 versions (~5 builds' worth: current `:main` plus
      # a rollback buffer) and deletes everything older, mirroring the
      # one-off manual cleanup this replaces.
      #
      # GITHUB_TOKEN cannot delete package versions for a user-namespace
      # package (only org-linked ones) -- this needs a classic PAT with the
      # delete:packages scope, stored as GHCR_CLEANUP_TOKEN (added + verified
      # against a real push-to-main run on 2026-07-25).
      - uses: actions/delete-package-versions@v5
        with:
          package-name: schrecknet
          package-type: container
          min-versions-to-keep: 15
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}

  deploy:
    needs: build
    # Only main pushes -- never PRs (no cluster credentials there, and
    # nothing should touch prod from an untrusted fork) and never tags
    # (a `v*` tag build isn't necessarily what's rolled out to the live
    # single-replica deployment, which always tracks `:main`; see
    # docs/adr/0013-ci-deploys-on-push-to-main.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save k8s-1-36-0-do-3-fra1-1784797648512

      # imagePullPolicy: Always + a rollout restart is enough here -- the
      # deployment always tracks the `:main` tag (k8s/deployment.yaml), so
      # there's no image reference to bump, just a pod to recreate.
      - name: Roll out schreck-net.com
        run: |
          kubectl -n schrecknet rollout restart deployment/schrecknet-server
          kubectl -n schrecknet rollout status deployment/schrecknet-server --timeout=120s

      # `rollout status` only proves the pod passed its readiness probe, and
      # that probe is `httpGet /` (k8s/deployment.yaml) -- which happily returns
      # index.html while the app is completely dead. During the 2026-07-29
      # outage both SQLite workers hung and this job still reported green.
      # These checks assert the things that were actually broken then:
      # the served HTML, the card database, and a prerendered card page.
      - name: Smoke-check the live site
        run: |
          set -euo pipefail
          base=https://schreck-net.com

          # 1. The shell is served and is really our app.
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$base/crypt" \
            | grep -q 'id="root"' || { echo "::error::/crypt did not return the app shell"; exit 1; }

          # 2. The card database the workers load is present and non-trivial.
          #    A hung worker can't be seen from curl, but a missing/broken
          #    /data payload is the other half of that failure mode.
          meta=$(curl -fsS "$base/data/cards.meta.json")
          echo "$meta" | grep -q '"schema_version"' || { echo "::error::cards.meta.json malformed"; exit 1; }
          bytes=$(curl -fsS -o /dev/null -w '%{size_download}' "$base/data/cards.sqlite")
          [ "$bytes" -gt 1000000 ] || { echo "::error::cards.sqlite too small ($bytes bytes)"; exit 1; }

          # 3. A card page is really prerendered, not just the SPA shell.
          #    (Dockerfile's prerender-build stage; 829 of these ship per build
          #    and nothing else tests them.) The JSON-LD block is the marker:
          #    a prerendered page has one, the SPA fallback has none -- so
          #    grepping for <title> alone would pass even when prerendering is
          #    completely broken. Card 100401 is Conditioning, a base-set V5
          #    card; if it ever leaves the pool this failing is correct.
          card=$(curl -fsS "$base/cards/100401")
          echo "$card" | grep -q 'application/ld+json' \
            || { echo "::error::/cards/100401 is not prerendered (no JSON-LD -- SPA fallback?)"; exit 1; }
          echo "$card" | grep -q '<title>Conditioning' \
            || { echo "::error::/cards/100401 prerendered with the wrong title"; exit 1; }

          echo "live smoke check passed ($bytes bytes of card data)"
