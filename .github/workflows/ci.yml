name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR: the later commit is the one
# whose result matters, and these jobs are long enough that stacking them up
# wastes a runner on an answer nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deliberately artifact-free. These jobs used to hand ~77 MB per run
# (dist/ with the semantic model + cards.sqlite, the debug server binary, and
# frontend/dist) from `rust`/`frontend` to `semantic-e2e` via upload-artifact.
# That made every run depend on the account's shared artifact-storage quota, and
# when that quota filled up the browser tests stopped running entirely — silently
# skipped, because the jobs they depended on "failed" on the upload step alone
# while every real check had passed. The e2e job now builds what it needs itself;
# Swatinem/rust-cache keeps the second Rust build cheap.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: core compiles to wasm
        run: cargo build -p schrecknet-core --target wasm32-unknown-unknown

  e2e:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest includes Google Chrome; avoid downloading a duplicate.
      SCHRECKNET_CHROME_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build core --release --target web --out-dir ../frontend/src/wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts skips Playwright's browser download; the tests drive the
      # runner's preinstalled Chrome via SCHRECKNET_CHROME_CHANNEL instead.
      - run: npm ci --ignore-scripts
        working-directory: frontend

      # Pure-node contract tests first: they need only the wasm build, so they
      # fail fast before the slower Rust data pipeline runs.
      - run: npm run test:card-text
        working-directory: frontend
      - run: npm run test:deck-organization
        working-directory: frontend
      - run: npm run test:deck-timing
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - name: data pipeline builds cards.sqlite
        run: cargo run -p schrecknet-data -- build --out dist
      - name: build smoke-test server
        run: cargo build -p schrecknet-server

      - name: mobile overflow + coarse-pointer controls
        run: npm run test:mobile && SCHRECKNET_MOBILE_WIDTH=320 npm run test:mobile
        working-directory: frontend
      - name: full local backup round-trips every user table
        run: npm run test:backup
        working-directory: frontend
      # Guards the 2026-07-29 outage class: a build that works from a fresh
      # profile but wedges for returning users, whose old service worker is
      # already installed and controlling the page. Every other suite starts
      # from a clean newContext(), so this is the only one that exercises it.
      - name: new build survives an already-installed service worker
        run: npm run test:sw-upgrade
        working-directory: frontend
      - name: exact composition + browser/native semantic parity + offline smoke
        run: npm run test:semantic
        working-directory: frontend
